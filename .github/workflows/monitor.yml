name: Financial Monitor Bot

on:
  schedule:
    - cron: '*/20 * * * *'  # 🌟 每 20 分鐘自動在雲端喚醒神獸檢查一次
  workflow_dispatch:      # 🌟 允許你在網頁上手動點按鈕進行測試

permissions:
  contents: write         # 🌟 允許機器人把已讀記憶本寫回你的 GitHub 倉庫

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 複製倉庫程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝必要工具清單
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 執行神獸監控
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -u cnyes_discord_monitor.py

      - name: 5. 自動保存已讀新聞記憶
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add tracked_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新已讀新聞紀錄 [skip ci]" && git push)
